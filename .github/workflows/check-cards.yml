name: Controllo schede progetti (telefono)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: python tools/check_cards.py | tee check.txt; echo "::notice title=Schede::$(tr '\n' ' ' < check.txt)"
      - run: |
          git config user.name designer1974; git config user.email rachidmarchoud@gmail.com
          git add screens; git commit -m "Controllo schede" || true; git push
